name: Build PR 345

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: 'k1tbyte/Wand-Enhancer'
          ref: 'refs/pull/345/head'
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore

      - name: Build Solution
        run: msbuild /p:Configuration=Release /p:Platform="Any CPU"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-PR345
          # 收集編譯輸出的 exe 與 dll
          path: |
            **/bin/Release/**/WandEnhancer.exe
            **/bin/Release/**/*.dll
            **/bin/Release/**/*.config
